services:
  postgres:
    image: postgres:16-alpine
    container_name: tradewise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradewise
      POSTGRES_PASSWORD: tradewise123
      POSTGRES_DB: tradewise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradewise -d tradewise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradewise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradewise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://tradewise:tradewise123@postgres:5432/tradewise
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-tradewise-jwt-development-key-32chars
      JWT_EXPIRY_MINUTES: 60
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradewise_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
